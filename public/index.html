<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Dekorasi Cahaya Latar Belakang -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>


    <div class="chat-messages" id="chatMessages">
      <div class="message-row bot-row">
        <div class="msg-avatar">✦</div>
        <div class="message bot-message">Halo! Ada yang bisa saya bantu hari ini?</div>
      </div>
    </div>

    <!-- Saran Topik Cepat -->
    <div class="quick-prompts" id="quickPrompts">
      <button type="button" class="chip" data-prompt="Berikan ide proyek web yang menarik">💡 Ide Proyek Web</button>
      <button type="button" class="chip" data-prompt="Jelaskan cara kerja REST API secara singkat">⚡ Apa itu REST API?</button>
      <button type="button" class="chip" data-prompt="Berikan motivasi belajar ngoding hari ini">🔥 Motivasi Ngoding</button>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input type="text" id="userInput" placeholder="Tanyakan apa saja di sini..." autocomplete="off" required />
      <button type="submit" id="sendBtn" aria-label="Kirim Pesan">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>
  </div>

  <script src="script.js"></script>
</body>
</html>
